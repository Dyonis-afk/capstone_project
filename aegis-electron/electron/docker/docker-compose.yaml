# AEGIS + BloodHound CE Docker Compose Configuration
services:
  bloodhound:
    image: specterops/bloodhound:latest
    container_name: aegis-bloodhound
    security_opt:
      - apparmor:unconfined
    ports:
      - "8080:8080"
    environment:
      - bhe_disable_cypher_qc=true
      - bhe_database_connection=user=bloodhound password=bloodhoundcommunityedition dbname=bloodhound host=postgres port=5432 sslmode=disable
      - bhe_neo4j_connection=neo4j://neo4j:bloodhoundcommunityedition@neo4j:7687
      - bhe_default_admin_principal_name=admin
      - bhe_default_admin_password=aegisadmin123
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - bloodhound_config:/opt/bloodhound/config
    restart: unless-stopped

  neo4j:
    image: neo4j:4.4-community
    container_name: aegis-neo4j
    security_opt:
      - apparmor:unconfined
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/bloodhoundcommunityedition
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_allow__upgrade=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p bloodhoundcommunityedition -a bolt://localhost:7687 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: aegis-postgres
    security_opt:
      - apparmor:unconfined
    environment:
      - POSTGRES_USER=bloodhound
      - POSTGRES_PASSWORD=bloodhoundcommunityedition
      - POSTGRES_DB=bloodhound
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound -d bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  bloodhound_config:
    name: aegis_bloodhound_config
  neo4j_data:
    name: aegis_neo4j_data
  neo4j_logs:
    name: aegis_neo4j_logs
  postgres_data:
    name: aegis_postgres_data
